<style>

html{scroll-padding-top:4rem}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top)}

['Vale','Especialista Gestão de Ativos','2022-11','2025-12','','Desenvolver e implementar estratégias para aumento da confiabilidade dos equipamentos rotativos críticos da planta. Conduzir análises de falhas utilizando metodologias como RCA (Root Cause Analysis), FMEA/FMECA, RCM e Análise de Modos de Falha. Identificar perdas de produção relacionadas a falhas mecânicas e propor soluções técnicas e processuais para mitigação. Definir, monitorar e analisar indicadores de confiabilidade, incluindo MTBF, MTTR, disponibilidade operacional e custo do ciclo de vida dos ativos. Elaborar planos de ação para eliminação de falhas recorrentes e aumento da vida útil dos equipamentos. Fornecer suporte técnico especializado para manutenção corretiva, preventiva e preditiva. Participar da elaboração e revisão de planos de manutenção baseados em criticidade e risco. Apoiar tecnicamente paradas programadas de manutenção e grandes intervenções em equipamentos críticos. Avaliar relatórios de inspeção, vibração, termografia, análise de óleo, ultrassom e demais técnicas preditivas. Garantir que os procedimentos de manutenção estejam alinhados às recomendações dos fabricantes e às melhores práticas do setor.'],

['Yara International','Analista de PCM SR','2020-02','2020-10','Home Office','Responsável pelo cumprimento das metas do planejamento e controle da manutenção preventiva/corretiva/preditiva e reposição de peças da unidade. Gestão de ordens de serviço, controle de backlog e paradas programadas.'],

['SICPA','Estagiária Técnico Administrativa','2009-01','2009-12','','Acompanhamento de pedidos de compras, rotinas de liberação de pagamentos, suporte gerencial e controle de arquivos.']

const FORM=[
['Universidade Tecnológica Federal do Paraná','Pós-graduação em Engenharia de Confiabilidade e Gestão de Ativos (abril de 2026 - agosto de 2027)'],
['PUCRS','MBA em Gestão de Projetos e Metodologias Ágeis (janeiro de 2026 - fevereiro de 2027)'],
['Estácio','Graduação em Engenharia Mecânica (fevereiro de 2020 - dezembro de 2025)'],
['Estácio','Graduação em Administração de Empresas (2010 - 2014)']
];

/* ---------- RENDER ---------- */
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ctl=(t,extra='')=>`<div class="ctl items-center gap-1 mb-1.5"><span class="mr-auto text-[10px] font-bold text-slate-400">${t}</span>${extra}<button class="cb" data-act="up">▲</button><button class="cb" data-act="down">▼</button><button class="cb r" data-act="del">✕</button></div>`;

function periodo(ini,fim,local){
  const a=new Date(ini+'-01'), atual=!fim, b=atual?new Date():new Date(fim+'-01');
  let t=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()+1;
  const y=Math.floor(t/12), m=t%12;
  const dur=[y?`${y} ano${y>1?'s':''}`:'',m?`${m} ${m>1?'meses':'mês'}`:''].filter(Boolean).join(' ');
  return `${MES[a.getMonth()]} de ${a.getFullYear()} - ${atual?'Atual':MES[b.getMonth()]+' de '+b.getFullYear()} (${dur})${local?' — '+local:''}`;
}
function expHTML(e){
  const [emp,cg,i,f,loc,tx]=e;
  return `<article class="card exp bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-1">
  ${ctl('🏢 Experiência')}
  <div class="ed exp-empresa font-bold text-sm text-slate-900">${esc(emp)}</div>
  <div class="ed exp-cargo font-semibold text-blue-700 text-xs">${esc(cg)}</div>
  <div class="ed exp-data text-slate-500 text-xs">${periodo(i,f,loc)}</div>
  <div class="ctl2 flex-wrap items-center gap-2 bg-blue-50 p-2 rounded-lg text-[11px]">
   <label>Início <input type="month" class="ini border rounded p-1 bg-white" value="${i}"></label>
   <label>Fim <input type="month" class="fim border rounded p-1 bg-white" value="${f}"></label>
   <label class="flex items-center gap-1"><input type="checkbox" class="atual" ${f?'':'checked'}> Atual</label>
   <button class="cb px-3 bg-blue-600 text-white" data-act="calc">Calcular</button>
  </div>
  <p class="ed exp-texto text-xs text-slate-700 leading-relaxed pt-1">${esc(tx)}</p>
 </article>`;
}
const itemHTML=(t,c)=>`<div class="card item flex items-center gap-1 bg-slate-800/50 rounded p-1"><span class="ed flex-1">• ${esc(t)}</span><button class="ctl cb r" data-act="del">✕</button></div>`;
const formHTML=(a,b)=>`<div class="card item flex items-start gap-2 bg-slate-50 border border-slate-200 rounded-xl p-2.5"><p class="ed flex-1">• <b>${esc(a)}</b> — ${esc(b)}</p><div class="ctl gap-1"><button class="cb" data-act="up">▲</button><button class="cb" data-act="down">▼</button><button class="cb r" data-act="del">✕</button></div></div>`;
const h2=(t,add)=>`<div class="flex items-center justify-between border-b border-slate-200 pb-1"><h2 class="text-xs font-extrabold text-blue-700 uppercase tracking-wider">${t}</h2>${add?`<button class="ctl cb px-3 bg-blue-600 text-white" data-act="${add}">➕ Nova</button>`:''}</div>`;

function render(){
  $('#folha').innerHTML=`

   <section><div class="flex items-center justify-between mb-1.5"><h3 class="text-[11px] font-bold text-slate-400">Competências</h3><button class="ctl cb px-2 bg-blue-600 text-white" data-act="add-comp">➕</button></div>

    <div id="lista-cert" class="space-y-1.5 text-slate-300">${CERT.map(itemHTML).join('')}</div></section>
  </aside>
  <div id="main" class="order-1 md:order-2 md:col-span-7 p-4 sm:p-8 space-y-5">

    <h1 id="c-nome" class="ed text-2xl font-black text-blue-700 uppercase tracking-tight break-words">Mariana Pereira Cruz</h1>
    <p id="c-cargo" class="ed text-xs font-semibold text-slate-600 leading-relaxed">${esc(CARGO)}</p>
   </header>
   <section class="space-y-1.5">${h2('Resumo')}<p id="c-resumo" class="ed text-xs leading-relaxed text-slate-700 text-justify">${esc(RESUMO)}</p></section>
   <section class="space-y-3">${h2('Experiência Profissional','add-exp')}<div id="lista-exp" class="space-y-3">${EXP.map(expHTML).join('')}</div></section>
   <section class="space-y-2">${h2('Formação Acadêmica','add-form')}<div id="lista-form" class="text-xs text-slate-700 space-y-2">${FORM.map(f=>formHTML(...f)).join('')}</div></section>
  </div>`;
}

/* ---------- AÇÕES (delegação de eventos) ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, c=b.closest('.card');
  if(a==='up'&&c?.previousElementSibling?.classList.contains('card')) c.parentNode.insertBefore(c,c.previousElementSibling);
  else if(a==='down'&&c?.nextElementSibling?.classList.contains('card')) c.parentNode.insertBefore(c.nextElementSibling,c);
  else if(a==='del'&&c&&confirm('Remover este item?')) c.remove();
  else if(a==='calc') calc(c);
  else if(a==='add-exp') add('#lista-exp',expHTML(['Empresa','Cargo',new Date().toISOString().slice(0,7),'','','Descreva as atividades...']),true);
  else if(a==='add-form') add('#lista-form',formHTML('Instituição','Curso (ano)'));
  else if(a==='add-comp') add('#lista-comp',itemHTML('Nova competência'));
  else if(a==='add-cert') add('#lista-cert',itemHTML('Nova certificação'));
  else return;
  salvar();
});
function add(sel,html,topo){
  const l=$(sel); l.insertAdjacentHTML(topo?'afterbegin':'beforeend',html); setEdit(true);
  const n=topo?l.firstElementChild:l.lastElementChild; n.scrollIntoView({behavior:'smooth',block:'center'});
}
function calc(c){
  const i=c.querySelector('.ini').value, f=c.querySelector('.fim').value, at=c.querySelector('.atual').checked;
  if(!i) return alert('Selecione o início.');
  const loc=(c.querySelector('.exp-data').innerText.split('—')[1]||'').trim();
  c.querySelector('.exp-data').innerText=periodo(i,at?'':(f||i),loc);
}
document.addEventListener('change',e=>{ // persiste valores de inputs no HTML salvo
  const t=e.target; if(t.type==='checkbox'){t.toggleAttribute('checked',t.checked)} else if(t.type==='month'){t.setAttribute('value',t.value)} else return; salvar();
});
document.addEventListener('input',salvar);
let ultimo=null;
document.addEventListener('focusin',e=>{if(e.target.classList?.contains('ed'))ultimo=e.target});

/* ---------- EDIÇÃO ---------- */
function setEdit(on){
  document.body.classList.toggle('editing',on);
  document.querySelectorAll('.ed').forEach(el=>on?el.setAttribute('contenteditable','true'):el.removeAttribute('contenteditable'));
  $('#btn-ed').textContent=on?'✅ Concluir':'✏️ Editar';
  $('#conteudo').style.paddingTop=on?'7.5rem':'4.5rem';
}
function toggleEdit(){setEdit(!document.body.classList.contains('editing'))}
function fmt(c,v=null){document.execCommand(c,false,v);salvar()}
function limpar(){if(ultimo){ultimo.textContent=ultimo.innerText;salvar()}}
function salvar(){
  const f=$('#folha'); if(f) try{localStorage.setItem(K,f.innerHTML)}catch(_){}
}

  if(navigator.share){try{await navigator.share({title:'Mariana Cruz - Currículo',text:t})}catch(_){}}

function abrirVagas(){
  let ex='';
  document.querySelectorAll('.exp').forEach(el=>{
    const g=s=>el.querySelector(s)?.innerText||'';
    ex+=`\n• ${g('.exp-empresa')} | ${g('.exp-cargo')} (${g('.exp-data')})\n${g('.exp-texto')}\n`;
  });
  $('#txt-vagas').value=`${$('#c-nome').innerText}\n${$('#c-cargo').innerText}\n\nCONTATO:\n${$('#c-contato').innerText}\n\nRESUMO:\n${$('#c-resumo').innerText}\n\nEXPERIÊNCIAS:${ex}`;
  $('#modal').classList.remove('hidden'); $('#modal').classList.add('flex');
}
async function copiarVagas(){
  await navigator.clipboard.writeText($('#txt-vagas').value);
  alert('✅ Texto copiado! Pode colar na Gupy ou no LinkedIn.');
  $('#modal').classList.add('hidden'); $('#modal').classList.remove('flex');
}
function exportarWord(){
  const cl=$('#folha').cloneNode(true);
  cl.querySelectorAll('.ctl,.ctl2,button,input').forEach(x=>x.remove());
  cl.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
  const html=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Currículo Mariana Cruz</title><style>
  body{font-family:Arial,sans-serif}table{width:100%;border-collapse:collapse;border:2px solid #1e3a8a}
  .s{width:35%;background:#0f172a;padding:18px;vertical-align:top}.s *{color:#f8fafc!important;font-size:11px}
  .m{width:65%;padding:22px;vertical-align:top}h1{color:#1d4ed8;font-size:20px;text-transform:uppercase}
  h2{color:#2563eb;font-size:13px;text-transform:uppercase;border-bottom:1px solid #cbd5e1;margin-top:14px}
  p,div,span{font-size:11px;line-height:1.4;color:#334155}</style></head><body><table><tr>
  <td class="s">${cl.querySelector('#side').innerHTML}</td><td class="m">${cl.querySelector('#main').innerHTML}</td></tr></table></body></html>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+html],{type:'application/msword'}));
  a.download='Curriculo_Mariana_Cruz.doc'; a.click();
}

/* ---------- VERSÕES ---------- */
const lerV=()=>{try{return JSON.parse(localStorage.getItem(KV)||'{}')}catch(_){return{}}};
function salvarVersao(){
  const n=prompt('Nome da versão (ex: Foco Confiabilidade):','Versão '+new Date().toLocaleDateString('pt-BR')); if(!n) return;
  const v=lerV(); v[n]=$('#folha').innerHTML; localStorage.setItem(KV,JSON.stringify(v)); listarV();
}
function listarV(){
  const v=lerV(), c=$('#lista-v'), ks=Object.keys(v); c.innerHTML='';
  if(!ks.length){c.innerHTML='<p class="text-xs text-slate-400 italic">Nenhuma versão salva.</p>';return}
  ks.forEach(k=>{
    const d=document.createElement('div'); d.className='bg-slate-50 border border-slate-200 rounded-xl p-2.5 flex items-center gap-2';
    d.innerHTML=`<span class="flex-1 truncate text-xs font-bold">📄 ${esc(k)}</span><button class="cb px-3 bg-blue-600 text-white" data-k="${encodeURIComponent(k)}" data-v="load">Abrir</button><button class="cb r" data-k="${encodeURIComponent(k)}" data-v="del">✕</button>`;
    c.appendChild(d);
  });
}
$('#lista-v').addEventListener('click',e=>{
  const b=e.target.closest('[data-v]'); if(!b) return;
  const k=decodeURIComponent(b.dataset.k), v=lerV();
  if(b.dataset.v==='load'&&v[k]){$('#folha').innerHTML=v[k];setEdit(false);salvar();scrollTo({top:0,behavior:'smooth'})}
  else if(b.dataset.v==='del'&&confirm(`Remover "${k}"?`)){delete v[k];localStorage.setItem(KV,JSON.stringify(v));listarV()}
});
function importar(ev){
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=x=>{
    const d=new DOMParser().parseFromString(x.target.result,'text/html');
    const fo=d.getElementById('curriculo-folha')||d.getElementById('folha');
    if(!fo) return alert('Arquivo não reconhecido como currículo.');
    $('#folha').innerHTML=fo.innerHTML; setEdit(false); salvar(); alert('📂 Currículo importado!');
  };
  r.readAsText(f); ev.target.value='';
}

/* ---------- LOGIN BIOMÉTRICO ---------- */
const liberar=()=>{$('#tela-login').classList.add('hidden');$('#conteudo').classList.remove('hidden')};
function sair(){localStorage.removeItem(KA);location.reload()}
async function entrar(){
  const er=$('#erro-bio'); er.classList.add('hidden');
  if(location.protocol==='file:'){localStorage.setItem(KA,'1');return liberar()}
  if(!window.PublicKeyCredential){er.textContent='Este navegador não suporta biometria.';er.classList.remove('hidden');return}
  try{
    const rnd=n=>crypto.getRandomValues(new Uint8Array(n)), id=localStorage.getItem(KB);
    if(!id){
      const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Currículo Mariana Cruz',id:location.hostname},
        user:{id:rnd(16),name:'mariana@curriculo.local',displayName:'Mariana Cruz'},
        pubKeyCredParams:[{alg:-7,type:'public-key'},{alg:-257,type:'public-key'}],
        authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
      if(c) localStorage.setItem(KB,btoa(String.fromCharCode(...new Uint8Array(c.rawId))));
      else return;
    }else{
      await navigator.credentials.get({publicKey:{challenge:rnd(32),userVerification:'required',timeout:60000,
        allowCredentials:[{id:Uint8Array.from(atob(id),c=>c.charCodeAt(0)),type:'public-key'}]}});
    }
    localStorage.setItem(KA,'1'); liberar();
  }catch(err){er.textContent='Digital não reconhecida ou cancelada. Toque novamente.';er.classList.remove('hidden')}
}

/* ---------- INÍCIO ---------- */
addEventListener('DOMContentLoaded',()=>{
  let s=null; try{s=localStorage.getItem(K)}catch(_){}
  s?$('#folha').innerHTML=s:render();
  setEdit(false); listarV();
  if(localStorage.getItem(KA)==='1') liberar();
});
</script>
